name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest -e .
      - run: python -m pytest -q -m 'not integration'
      - run: bash agentrail/scripts/test-install.sh && bash agentrail/scripts/test-install
  workflow-console:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentrail
          POSTGRES_PASSWORD: agentrail
          POSTGRES_DB: agentrail_proof
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentrail"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://agentrail:agentrail@127.0.0.1:5432/agentrail_proof
      AUTH_SECRET: isolated-ci-workflow-proof-only
      AUTH_TRUST_HOST: 'true'
      AGENTRAIL_PUBLIC_URL: http://127.0.0.1:3310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentrail/github-app build
      - run: pnpm --filter @agentrail/db-postgres build
      - run: pnpm --filter @agentrail/db-postgres migrate
      - run: pnpm --filter @agentrail/db-postgres test
      - run: pnpm --filter @agentrail/mcp build && pnpm --filter @agentrail/mcp test
      - run: pnpm --filter @agentrail/console exec vitest run --maxWorkers=2
      - run: pnpm --filter @agentrail/console build
      - name: Real MCP to production Console and PostgreSQL
        run: node packages/mcp/scripts/proof-with-console.mjs
