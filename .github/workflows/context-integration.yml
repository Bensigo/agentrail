name: Context integration

# Full-checkout retrieval quality and pinned-corpus proofs are valuable but
# expensive. Keep them visible and blocking when context/eval code changes,
# without making every unrelated PR build the repository's generated index.

on:
  pull_request:
    paths:
      - "agentrail/context/**"
      - "agentrail/evals/**"
      - "agentrail/tests/context/**"
      - "agentrail/tests/evals/**"
      - "agentrail/tests/conftest.py"
      - "pyproject.toml"
      - ".github/workflows/context-integration.yml"
  push:
    branches: [main]
    paths:
      - "agentrail/context/**"
      - "agentrail/evals/**"
      - "agentrail/tests/context/**"
      - "agentrail/tests/evals/**"
      - "agentrail/tests/conftest.py"
      - "pyproject.toml"
      - ".github/workflows/context-integration.yml"
  workflow_dispatch:

concurrency:
  group: context-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  context-basic:
    runs-on: ubuntu-latest
    # The deepest fixture intentionally scans the full generated index and can
    # take several minutes on a hosted runner; this bound still prevents an
    # accidental hang without making the quality lane flaky.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package and test runner
        run: python -m pip install --upgrade pip pytest -e .
      - name: Build repository context index once
        run: python -m agentrail.cli.main context index --target . --no-push
      - name: Run context integration tests except symbol proofs
        run: >-
          python -m pytest -q -m integration agentrail/tests/context
          --ignore=agentrail/tests/context/test_symbol_candidates.py
          --ignore=agentrail/tests/context/test_symbol_packing.py

  context-symbol:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package and test runner
        run: python -m pip install --upgrade pip pytest -e .
      - name: Build repository context index once
        run: python -m agentrail.cli.main context index --target . --no-push
      - name: Run symbol recall integration tests
        run: >-
          python -m pytest -q -m integration
          agentrail/tests/context/test_symbol_candidates.py
          agentrail/tests/context/test_symbol_packing.py

  eval-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package and test runner
        run: python -m pip install --upgrade pip pytest -e .
      - name: Build repository context index once
        run: python -m agentrail.cli.main context index --target . --no-push
      - name: Run corpus and hidden-test integration proofs
        run: >-
          python -m pytest -q -m integration
          agentrail/tests/evals/test_corpus_pins.py
          agentrail/tests/evals/test_hidden_tests.py
          agentrail/tests/cli/test_evals_cli.py

  eval-spine-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package and test runner
        run: python -m pip install --upgrade pip pytest -e .
      - name: Build repository context index once
        run: python -m agentrail.cli.main context index --target . --no-push
      - name: Run spine CLI integration proofs
        run: >-
          python -m pytest -q -m integration agentrail/tests/evals/test_spine.py
          -k 'cli_evals_run'

  eval-spine-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package and test runner
        run: python -m pip install --upgrade pip pytest -e .
      - name: Build repository context index once
        run: python -m agentrail.cli.main context index --target . --no-push
      - name: Run spine retrieval integration proofs
        run: >-
          python -m pytest -q -m integration
          agentrail/tests/evals/test_spine.py
          -k 'e2e_pack_precision_recall_populated_on_real_run or e2e_rerank_flag_toggles_the_cited_set'
