name: agentrail-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm local:up}
      POSTGRES_DB: agentrail
    ports:
    - 127.0.0.1:${PG_PORT}:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U agentrail -d agentrail
      interval: 3s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 256M
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_DB: agentrail
      CLICKHOUSE_USER: agentrail
      CLICKHOUSE_PASSWORD: ${POSTGRES_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
    - 127.0.0.1:${CLICKHOUSE_PORT}:8123
    volumes:
    - chdata:/var/lib/clickhouse
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8123/ping | grep -q Ok
      interval: 3s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 768M
  minio-permissions:
    image: alpine:3.20
    user: 0:0
    volumes:
    - miniodata:/data
    command:
    - chown
    - -R
    - 65532:65532
    - /data
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address :9001
    depends_on:
      minio-permissions:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: agentrail
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
    - 127.0.0.1:${MINIO_PORT}:9000
    - 127.0.0.1:${MINIO_CONSOLE_PORT}:9001
    volumes:
    - miniodata:/data
    deploy:
      resources:
        limits:
          memory: 256M
volumes:
  pgdata: null
  chdata: null
  miniodata: null
