name: agentrail
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: agentrail
      POSTGRES_PASSWORD: agentrail
      POSTGRES_DB: agentrail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentrail -d agentrail"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      CLICKHOUSE_DB: agentrail
      CLICKHOUSE_USER: agentrail
      CLICKHOUSE_PASSWORD: agentrail
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -c Ok"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-permissions:
    image: alpine:3.20
    volumes: ["miniodata:/data"]
    command: ["chown", "-R", "65532:65532", "/data"]
  minio:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio-permissions: {condition: service_completed_successfully}
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: agentrail
      MINIO_ROOT_PASSWORD: agentrail123
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
  minio-init:
    image: node:24-alpine
    working_dir: /workspace
    volumes: [".:/workspace:ro"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: agentrail
      S3_SECRET_KEY: agentrail123
    depends_on:
      minio: {condition: service_started}
    command: ["node", "apps/console/scripts/local-storage-init.mjs"]

volumes:
  pgdata:
  chdata:
  miniodata:
